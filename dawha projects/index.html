<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root { --maroon:#7a1f2b; --maroon-dark:#4f1019; --gold:#c9a24a; --gold-light:#f1dfae; --cream:#fbf6ec; --ink:#2b1d1f; --muted:#6d5b5e; --ok:#2f8f5b; --bad:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:"Cairo","Segoe UI",Tahoma,sans-serif; color:var(--ink); line-height:1.8; background:var(--cream); overflow-x:hidden; }
  .bg-leaves { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .leaf { position:absolute; bottom:-60px; width:26px; height:40px; opacity:.22; background:linear-gradient(135deg,var(--gold),#b8792a); border-radius:0 70% 0 70%; animation:rise linear infinite; }
  @keyframes rise { from { transform:translateY(0) rotate(0); } to { transform:translateY(-120vh) rotate(360deg); } }
  .wrap { position:relative; z-index:1; }
  header.top { background:var(--maroon); color:var(--gold-light); text-align:center; padding:1.4rem 1rem 1rem; }
  .logo { width:90px; height:90px; border-radius:50%; border:3px solid var(--gold); object-fit:cover; background:var(--cream); animation:glow 3s ease-in-out infinite, bob 4s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow:0 0 0 10px rgba(201,162,74,.18); } }
  @keyframes bob { 50% { transform:translateY(-4px); } }
  header.top h1 { font-family:"Aref Ruqaa",serif; font-size:2.1rem; margin:.4rem 0 0; }
  header.top p { margin:0; opacity:.85; }
  nav.top { display:flex; flex-wrap:wrap; justify-content:center; gap:.35rem; background:var(--maroon-dark); padding:.5rem; position:sticky; top:0; z-index:10; }
  nav.top a { color:var(--gold-light); text-decoration:none; padding:.4rem .9rem; border-radius:999px; font-weight:700; font-size:.95rem; transition:transform .2s, background .2s; }
  nav.top a:hover, nav.top a.active { background:var(--gold); color:var(--maroon-dark); transform:translateY(-2px); }
  main { max-width:960px; margin:0 auto; padding:2rem 1.1rem 3rem; }
  .view { animation:fadeUp .6s ease both; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
  .hero { text-align:center; padding:1rem 0 2rem; }
  .hero h2 { font-family:"Aref Ruqaa",serif; font-size:2.5rem; color:var(--maroon); margin:0 0 .3rem; }
  .hero p { color:var(--muted); max-width:640px; margin:.4rem auto; }
  .btn { display:inline-block; background:var(--maroon); color:var(--gold-light); border:0; padding:.7rem 1.5rem; border-radius:999px; font:700 1.02rem "Cairo",sans-serif; cursor:pointer; text-decoration:none; margin-top:.8rem; transition:transform .2s; box-shadow:0 6px 18px rgba(122,31,43,.25); animation:pulse 2.4s ease-in-out infinite; }
  .btn:hover { transform:translateY(-3px) scale(1.03); }
  .btn.alt { background:var(--gold); color:var(--maroon-dark); }
  @keyframes pulse { 50% { box-shadow:0 6px 28px rgba(201,162,74,.5); } }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:1rem; }
  .rule-card { background:#fff; border:1px solid var(--gold-light); border-radius:18px; padding:1.2rem; text-decoration:none; color:inherit; display:block; transition:transform .25s, box-shadow .25s; animation:fadeUp .6s ease both; }
  .rule-card:nth-child(2) { animation-delay:.1s; } .rule-card:nth-child(3) { animation-delay:.2s; } .rule-card:nth-child(4) { animation-delay:.3s; }
  .rule-card:hover { transform:translateY(-6px); box-shadow:0 14px 28px rgba(122,31,43,.15); }
  .rule-card .glyph { font-family:"Aref Ruqaa",serif; font-size:2.6rem; color:var(--maroon); line-height:1.2; }
  .rule-card h3 { margin:.2rem 0; color:var(--maroon-dark); }
  .rule-card p { margin:0; color:var(--muted); font-size:.95rem; }
  .panel { background:#fff; border:1px solid var(--gold-light); border-radius:20px; padding:1.5rem; box-shadow:0 6px 18px rgba(122,31,43,.07); margin-bottom:1.2rem; }
  .panel h2 { font-family:"Aref Ruqaa",serif; color:var(--maroon); font-size:1.9rem; margin:0 0 .4rem; }
  .panel ul { padding-right:1.2rem; margin:.5rem 0; } .panel li { margin:.3rem 0; }
  .examples { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:.6rem; margin-top:1rem; }
  .ex { background:var(--cream); border-right:4px solid var(--gold); border-radius:12px; padding:.6rem; text-align:center; animation:fadeUp .5s ease both; }
  .ex .w { font-family:"Aref Ruqaa",serif; font-size:1.8rem; color:var(--ink); }
  .ex mark, .fill mark { background:none; color:var(--maroon); font-weight:900; border-bottom:3px solid var(--gold); }
  .pager { display:flex; justify-content:space-between; gap:.6rem; margin-top:1rem; flex-wrap:wrap; }
  /* fill-in */
  .progress { height:12px; background:var(--gold-light); border-radius:999px; overflow:hidden; margin:.6rem 0 1rem; }
  .progress > div { height:100%; width:0; background:linear-gradient(90deg,var(--gold),var(--maroon)); transition:width .5s ease; }
  .score-line { display:flex; justify-content:space-between; color:var(--muted); font-weight:700; }
  .hint { color:var(--muted); font-size:.95rem; margin-top:.6rem; }
  .word { font-family:"Aref Ruqaa",serif; font-size:3.6rem; text-align:center; color:var(--ink); margin:.6rem 0 .4rem; animation:fadeUp .4s ease both; }
  .blank { display:inline-block; width:.8em; height:1.1em; border:2px dashed var(--gold); border-radius:8px; vertical-align:middle; margin:0 .05em; background:var(--cream); animation:blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { border-color:var(--maroon); background:#fff; } }
  .opts { display:flex; flex-wrap:wrap; justify-content:center; gap:.7rem; }
  .opt { min-width:96px; background:var(--cream); border:2px solid var(--gold-light); border-radius:16px; padding:.7rem 1rem; font-family:"Aref Ruqaa",serif; font-size:2.2rem; cursor:pointer; color:var(--ink); transition:transform .15s, border-color .2s; }
  .opt:hover:not(:disabled) { transform:translateY(-4px); border-color:var(--gold); }
  .opt.right { background:#d8f3e3; border-color:var(--ok); animation:pop .5s ease; }
  .opt.wrong { background:#f8dcd9; border-color:var(--bad); animation:shake .45s ease; }
  .opt:disabled { cursor:default; }
  @keyframes pop { 40% { transform:scale(1.1); } }
  @keyframes shake { 20%,60% { transform:translateX(-6px); } 40%,80% { transform:translateX(6px); } }
  .feedback { min-height:2.2rem; margin-top:.8rem; font-weight:700; text-align:center; }
  .feedback.ok { color:var(--ok); } .feedback.no { color:var(--bad); }
  .final { text-align:center; }
  .trophy { font-size:4rem; display:inline-block; animation:float 2s ease-in-out infinite; }
  @keyframes float { 50% { transform:translateY(-6px); } }
  .confetti { position:fixed; top:-20px; width:10px; height:14px; z-index:20; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); } }
  .letters { direction:rtl; }
  .letter { display:inline; cursor:pointer; border-radius:8px; transition:background .2s; }
  .letter:hover { background:var(--gold-light); }
  .letter.err { color:var(--bad); }
  .chips { display:flex; flex-wrap:wrap; justify-content:center; gap:.6rem; margin:1rem 0; }
  .chip { font-family:"Aref Ruqaa",serif; font-size:2.2rem; background:var(--cream); border:2px solid var(--gold); border-radius:14px; padding:.2rem .9rem; cursor:grab; user-select:none; transition:transform .15s; }
  .chip:hover { transform:translateY(-3px); }
  .chip.sel { background:var(--gold); color:var(--maroon-dark); box-shadow:0 0 0 4px rgba(201,162,74,.35); }
  .chip.used { opacity:.25; cursor:default; }
  .drag-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:.8rem; }
  .drag-word { background:var(--cream); border-radius:14px; padding:.6rem; text-align:center; }
  .drag-word .word { font-size:2.6rem; margin:.2rem 0; }
  .slot { display:inline-block; width:.9em; height:1.1em; border:2px dashed var(--gold); border-radius:8px; vertical-align:middle; background:#fff; cursor:pointer; }
  .slot:hover:not(.ok) { border-style:solid; border-color:var(--maroon); }
  .slot.ok { border:2px solid var(--ok); background:#d8f3e3; color:var(--ok); width:auto; height:auto; padding:0 .15em; font-size:.85em; }
  .slot.bad { animation:shake .45s ease; border-color:var(--bad); }
  @keyframes shimmer { from { background-position:200% center; } to { background-position:-200% center; } }
  @keyframes wiggle { 0%,100% { transform:rotate(0); } 25% { transform:rotate(-7deg); } 75% { transform:rotate(7deg); } }
  @keyframes popIn { 0% { opacity:0; transform:scale(.85); } 70% { transform:scale(1.03); } 100% { opacity:1; transform:none; } }
  @keyframes sheen { to { transform:translateX(120%); } }
  .hero h2, header.top h1 { background-size:200% auto; -webkit-background-clip:text; background-clip:text; color:transparent; animation:shimmer 5s linear infinite; }
  .hero h2 { background-image:linear-gradient(90deg,var(--maroon),var(--gold),var(--maroon)); }
  header.top h1 { background-image:linear-gradient(90deg,var(--gold-light),#fff3cf,var(--gold-light)); }
  .rule-card:hover { transform:translateY(-8px) rotate(-1deg); }
  .rule-card:hover .glyph { animation:wiggle .6s ease; }
  .ex { transition:transform .25s, box-shadow .25s; }
  .ex:hover { transform:translateY(-4px) scale(1.05); box-shadow:0 8px 18px rgba(122,31,43,.15); }
  .progress > div { position:relative; overflow:hidden; }
  .progress > div::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent); transform:translateX(-100%); animation:sheen 1.8s ease-in-out infinite; }
  .opt { transition:transform .2s, border-color .2s, box-shadow .2s, background .2s; }
  .opt:hover:not(:disabled) { box-shadow:0 8px 18px rgba(201,162,74,.35); }
  .chip:hover { animation:wiggle .5s ease; }
  .final .trophy { animation:popIn .8s ease both, float 1.6s ease-in-out .8s infinite; }
  .btn { background-image:linear-gradient(120deg,var(--maroon),#a33446,var(--maroon)); background-size:200% auto; }
  .btn:hover { background-position:100% center; }
  /* readable, connected Arabic text everywhere */
  *, *::before, *::after { font-family:"Cairo", "Segoe UI", Tahoma, sans-serif !important; }
  .hero h2, header.top h1, .panel h2, .rule-card .glyph, .word, .opt, .chip, .ex .w, footer.top strong { font-weight:800; }
  .hero h2 { font-size:2.3rem; }
  .panel h2 { font-size:1.6rem; }
  .rule-card .glyph { font-size:2.2rem; }
  .word { font-size:2.9rem; line-height:2.1; }
  .opt { font-size:1.7rem; }
  .chip { font-size:1.8rem; }
  .ex .w { font-size:1.6rem; }
  .letter { display:inline; }

  );

/* ===== ABOUT PAGE ===== */

.about-page {
  max-width: 950px;
  margin: auto;
  padding-bottom: 35px;
}

/* العنوان */
.about-hero {
  text-align: center;
  margin-bottom: 25px;
}

.about-hero h2 {
  margin-bottom: 10px;
}

.about-hero p {
  max-width: 600px;
  margin: auto;
  line-height: 1.9;
}

/* قسم المميزات */
.about-panel {
  background: #fff;
  border: 1px solid #e5ece6;
  border-radius: 18px;
  padding: 25px;
  margin-bottom: 28px;
  box-shadow: 0 5px 18px rgba(23, 60, 50, .05);
}

.about-panel > h2 {
  color: #173c32;
  font-size: 1.35rem;
  margin: 0 0 22px;
  text-align: right;
}

.about-features {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
}

.about-feature {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 13px;
  padding: 19px;
  border-radius: 14px;
  background: #f5f8f5;
  border: 1px solid #edf1ed;
}

.about-feature > span {
  display: grid;
  place-items: center;
  width: 45px;
  height: 45px;
  border-radius: 12px;
  background: #dcebdc;
  font-size: 1.35rem;
}

.about-feature strong {
  display: block;
  color: #173c32;
  font-size: 1rem;
  margin-bottom: 7px;
}

.about-feature p {
  color: #69776e;
  font-size: .88rem;
  line-height: 1.8;
  margin: 0;
}

/* بطاقة المطور */
.about-dev {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  max-width: 420px;
  margin: 0 auto;
  padding: 28px 25px;
  background: #fff;
  border: 1px solid #e5ece6;
  border-radius: 20px;
  box-shadow: 0 6px 22px rgba(23, 60, 50, .07);
}

.dev-title {
  color: #a58432;
  font-size: .9rem;
  font-weight: 800;
  margin-bottom: 18px;
}

.dev-img {
  width: 120px;
  height: 120px;
  object-fit: cover;
  border-radius: 50%;
  border: 4px solid #dcebdc;
  outline: 2px solid #c69b35;
  margin-bottom: 18px;
}

.about-dev h2 {
  color: #173c32;
  font-size: 1.4rem;
  font-weight: 900;
  margin: 0 0 7px;
}

.dev-role {
  color: #78877c;
  font-size: .9rem;
  margin: 0;
}

.dev-line {
  width: 45px;
  height: 3px;
  background: #c69b35;
  border-radius: 5px;
  margin: 17px 0;
}

.dev-description {
  color: #53675a;
  font-size: .95rem;
  font-weight: 700;
  margin: 0;
}

@media (max-width: 700px) {
  .about-features {
    grid-template-columns: 1fr;
  }

  .about-panel {
    padding: 20px 15px;
  }

  .about-feature {
    flex-direction: row;
    align-items: center;
  }

  .about-feature > span {
    flex-shrink: 0;
  }

  .about-dev {
    max-width: 100%;
  }
}

function runQuiz(box, questions, perPoint, onDone) {
  let i = 0;
  let score = 0;

  const draw = () => {
    if (i >= questions.length) {
      onDone(score, questions.length);
      return;
    }

    const q = questions[i];

    // ضمان وجود الإجابة الصحيحة ضمن الخيارات
    const options = [...new Set([...(q.o || []), q.a])];
    const correctIndex = options.indexOf(q.a);

    box.innerHTML = `
      <div class="score-line">

        ).join("")}

        btns.forEach(x => x.disabled = true);

        const k = Number(b.dataset.k);
        const fb = box.querySelector("#fb");
        const correct = k === correctIndex;

        if (correct) {
          sfx(true);
          speakWord(q.w);
          score++;

          b.classList.add("right");
          fb.className = "feedback ok";
          fb.innerHTML = `أحسنت! ✨ الكلمة: ${shown(q.w, q.p)}`;
        } else {
          sfx(false);

          b.classList.add("wrong");

          fb.className = "feedback no";
          fb.innerHTML = `الصحيح هو «${q.a}» في الكلمة: ${shown(q.w, q.p)}`;
        }

        setTimeout(() => {
          i++;
          draw();
        }, 1700);
      };
    });
  };

  draw();
}

function drawFix() {
  const box = document.getElementById("fixBox");
  if (!box) return;

  if (!fx) {
    const source = WRONG_SET.filter(([w, p]) =>
      ALL.some(x =>
        x.w === w &&
        x.p === p &&
        (selectedRuleId === "all" || x.r.id === selectedRuleId)
      )
    );

    if (!source.length) {
      box.innerHTML = `
        <div class="final">
          <h2>لا توجد أسئلة لهذه القاعدة حاليًا</h2>
          <a class="btn" href="#choose-game-fix">اختر قاعدة أخرى</a>
        </div>
      `;
      return;
    }

    fx = {
      items: shuffle(source).slice(0, 6).map(([w, p, bad]) => ({
        w,
        p,
        bad,
        a: [...w][p],
        wrong: [...w].map((c, k) => k === p ? bad : c).join("")
      })),
      i: 0,
      score: 0,
      phase: "find",
      solved: false,
      msg: "",
      type: ""
    };
  }

  if (fx.i >= fx.items.length) {
    const max = fx.items.length * 10;

    box.innerHTML = `
      <div class="final">
        <div class="trophy">${fx.score >= max * .7 ? "🏆" : "⭐"}</div>
        <h2>نتيجتك: ${fx.score} من ${max}</h2>
        <button class="btn" id="fixAgain">العب مرة أخرى</button>
      </div>
    `;

    document.getElementById("fixAgain").onclick = () => {
      fx = null;
      drawFix();
    };

    if (fx.score >= max * .7) confetti();
    return;
  }

  const q = fx.items[fx.i];
  const word = fx.solved ? q.w : q.wrong;

  const letters = [...word].map((c, k) =>
    `<span class="letter${k === q.p && fx.phase === "fix" && !fx.solved ? " err" : ""}" data-k="${k}">${c}</span>`
  ).join("");

  let controls;

  if (fx.phase === "find") {
    controls = `<div class="hint">اضغط على الحرف الخاطئ</div>`;
  } else {
    if (!q.opts) {
      q.opts = shuffle([
        q.a,
        ...shuffle(HAMZAS.filter(h => h !== q.a && h !== q.bad)).slice(0, 2)
      ]);
    }

    controls = `
      <div class="hint">اختر الهمزة الصحيحة</div>
      <div class="opts">
        ${q.opts.map(g => `<button class="opt" data-g="${g}">${g}</button>`).join("")}
      </div>
    `;
  }

  box.innerHTML = `
    <div class="score-line">
      <span>كلمة ${fx.i + 1} من ${fx.items.length}</span>
      <span>النقاط: ${fx.score}</span>
    </div>

    <div class="progress">
      <div style="width:${(fx.i / fx.items.length) * 100}%"></div>
    </div>

    <div class="word letters">${letters}</div>
    ${controls}
    <div class="feedback ${fx.type}">${fx.msg}</div>
  `;

  if (fx.phase === "find") {
    box.querySelectorAll(".letter").forEach(el => {
      el.onclick = () => {
        if (+el.dataset.k === q.p) {
          fx.phase = "fix";
          fx.msg = "أحسنت، هذا هو الحرف الخاطئ";
          fx.type = "ok";
        } else {
          fx.msg = "هذا الحرف صحيح، ابحث عن الخطأ";
          fx.type = "no";
        }

        drawFix();
      };
    });
  } else {
    box.querySelectorAll(".opt").forEach(b => {
      b.onclick = () => {
        if (fx.solved) return;

        if (b.dataset.g === q.a) {
          sfx(true);
          speakWord(q.w);

          fx.solved = true;
          fx.score += 10;
          fx.msg = "صحيح! +10 ✨";
          fx.type = "ok";

          drawFix();

          setTimeout(() => {
            fx.i++;
            fx.phase = "find";
            fx.solved = false;
            fx.msg = "";
            fx.type = "";
            drawFix();
          }, 1400);
        } else {
          fx.msg = "ليست الهمزة الصحيحة، جرّب مرة أخرى";
          fx.type = "no";
          sfx(false);
          drawFix();
        }
      };
    });
  }
}



function drawDrag() {
  const box = document.getElementById("dragBox");
  if (!box) return;

  if (!dg) {
    const source = selectedRuleId === "all"

      : ALL.filter(x => x.r.id === selectedRuleId);

        </div>
      `;
      return;
    }

    const picks = shuffle(source).slice(0, 4);

    dg = {
      picks,
      chips: shuffle(picks.map(x => x.a)),
      used: [],
      filled: {},
      sel: null,
      score: 0,
      msg: "",
      type: "",
      bad: null
    };
  }

  if (Object.keys(dg.filled).length === dg.picks.length) {
    const max = dg.picks.length * 10;

    box.innerHTML = `
      <div class="final">
        <div class="trophy">${dg.score === max ? "🏆" : "⭐"}</div>

      </div>
    `;

    document.getElementById("dragAgain").onclick = () => {
      dg = null;
      drawDrag();
    };

    if (dg.score === max) confetti();
    return;
  }

  const chips = dg.chips.map((g, i) =>
    dg.used.includes(i)
      ? `<div class="chip used">${g}</div>`
      : `<div class="chip${dg.sel === i ? " sel" : ""}" draggable="true" data-chip="${i}">${g}</div>`
  ).join("");

  const words = dg.picks.map((x, i) => {
    const inner = [...x.w].map((c, k) =>
      k !== x.p
        ? c
        : dg.filled[i]
          ? `<span class="slot ok">${dg.filled[i]}</span>`
          : `<span class="slot${dg.bad === i ? " bad" : ""}" data-slot="${i}"></span>`
    ).join("");

    return `<div class="drag-word"><div class="word">${inner}</div></div>`;
  }).join("");

  box.innerHTML = `
    <div class="hint">اسحب الهمزة إلى الفراغ المناسب، أو اضغط الهمزة ثم الفراغ</div>
    <div class="chips">${chips}</div>
    <div class="drag-grid">${words}</div>
    <div class="feedback ${dg.type}">${dg.msg}</div>
  `;

  box.querySelectorAll(".chip[data-chip]").forEach(el => {
    el.addEventListener("dragstart", e => {
      e.dataTransfer.setData("text/plain", el.dataset.chip);
    });

    el.onclick = () => {
      const c = +el.dataset.chip;
      dg.sel = dg.sel === c ? null : c;
      dg.msg = "";
      drawDrag();
    };
  });

  box.querySelectorAll(".slot:not(.ok)").forEach(el => {
    el.addEventListener("dragover", e => e.preventDefault());

    el.addEventListener("drop", e => {
      e.preventDefault();
      placeDrag(+el.dataset.slot, +e.dataTransfer.getData("text/plain"));
    });

    el.onclick = () => {
      if (dg.sel !== null) {
        placeDrag(+el.dataset.slot, dg.sel);
      }
    };
  });
}


function placeDrag(slot, chip) {
  if (!dg || dg.filled[slot] || dg.used.includes(chip)) return;

  const glyph = dg.chips[chip];

  dg.sel = null;
  dg.bad = null;

  if (glyph === dg.picks[slot].a) {
    sfx(true);
    speakWord(dg.picks[slot].w);

    dg.filled[slot] = glyph;
    dg.used.push(chip);
    dg.score += 10;
    dg.msg = "أحسنت! +10";
    dg.type = "ok";
  } else {
    sfx(false);
    dg.bad = slot;
    dg.msg = "هذه ليست الهمزة المناسبة لهذه الكلمة";
    dg.type = "no";
  }

  drawDrag();
}


let audioCtx = null;
function tone(freq, dur, type, t) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
// short built-in sounds: a rising chime for correct, a low buzz for wrong
function sfx(ok) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const t0 = audioCtx.currentTime;
    if (ok) [523.25, 659.25, 783.99].forEach((f, i) => tone(f, .18, "sine", t0 + i * .09));
    else [330, 262].forEach((f, i) => tone(f, .22, "triangle", t0 + i * .16));
  } catch (e) {}
}
// reads the word aloud using the device's Arabic voice, if one is installed
function speakWord(w) {
  if (!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const u = new SpeechSynthesisUtterance(w);

  u.lang = "ar";
  u.rate = 0.95;
  u.pitch = 1;
  u.volume = 1;

  const voices = speechSynthesis.getVoices();

  const arabicVoice = voices.find(v =>
    /^ar(-|$)/i.test(v.lang) &&
    /Microsoft|Google/i.test(v.name)
  ) || voices.find(v =>
    /^ar(-|$)/i.test(v.lang)
  );

  if (arabicVoice) {
    u.voice = arabicVoice;
    u.lang = arabicVoice.lang;
  }

  speechSynthesis.speak(u);
}

let pa = null;
const paraOptionsCount = level => level === "سهل" ? 3 : level === "متوسط" ? 4 : 6;
const makeOpts = (a, n) => shuffle([a, ...shuffle(HAMZAS.filter(h => h !== a)).slice(0, n - 1)]);

function resetPara(level, idx) {
  pa = {
    level,
    idx,
    vals: {},
    ok: {},
    active: null,
    score: 0,
    opts: {},
    attempts: {},
    showHint: {},
    msg: "",
    msgType: "",
    celebrated: false
  };
}

function paraPage() { return `<section class="view"><div class="hero"><h2>أكمل النص</h2><p>اختر المستوى ثم الفقرة، واضغط كل فراغ واختر الهمزة الصحيحة. إذا أخطأت مرتين يظهر لك تلميح.</p></div><div class="panel" id="paraBox"></div></section>`; }


function drawPara() {
  const box = document.getElementById("paraBox");
  if (!box) return;

  if (!pa) resetPara("سهل", 0);

  const toks = PARAS[pa.level][pa.idx];

  const blanks = toks
    .filter(t => typeof t !== "string")
    .map(t => ({
      ...t,
      a: [...t.w][t.p],
      rule: ALL.find(x => x.w === t.w && x.p === t.p)?.r.id
    }))
    .filter(t =>
      selectedRuleId === "all" || t.rule === selectedRuleId
    );

  const blankMap = new Map();
  let blankIndex = 0;

  toks.forEach((t, tokenIndex) => {
    if (typeof t !== "string") {
      const rule = ALL.find(x => x.w === t.w && x.p === t.p)?.r.id;

      if (selectedRuleId === "all" || rule === selectedRuleId) {
        blankMap.set(tokenIndex, blankIndex++);
      }
    }
  });

  const n = blanks.length;
  const found = Object.keys(pa.ok).filter(k => pa.ok[k]).length;
  const done = n > 0 && found === n;

  let body = "";

  toks.forEach((t, tokenIndex) => {
    if (typeof t === "string") {
      body += t;
      return;
    }

    const i = blankMap.get(tokenIndex);

    if (i === undefined) {
      body += t.w;
      return;
    }

    const v = pa.vals[i];
    const cls = pa.ok[i]
      ? " ok"
      : v
        ? " bad"
        : pa.active === i
          ? " active"
          : "";

    body += [...t.w].map((c, k) =>
      k === t.p
        ? `<span class="pblank${cls}" data-i="${i}">${pa.ok[i] ? blanks[i].a : (v || "ـ")}</span>`
        : c
    ).join("");
  });

  const levelBtns = Object.keys(PARAS).map(l =>
    `<button class="btn${l === pa.level ? "" : " alt"} lvl" data-level="${l}" style="margin-top:0">${l}</button>`
  ).join(" ");

  const paraBtns = PARAS[pa.level].map((_, k) =>
    `<button class="btn${k === pa.idx ? "" : " alt"} fp" data-idx="${k}" style="margin-top:0">فقرة ${k + 1}</button>`
  ).join(" ");

  let controls = "";

  if (!done && pa.active !== null) {
    const i = pa.active;

    pa.opts[i] = pa.opts[i] || makeOpts(
      blanks[i].a,
      paraOptionsCount(pa.level)
    );

    const hintShown = pa.showHint[i] || (pa.attempts[i] || 0) >= 2;

    controls = `
      <div id="paraControls">
        <div class="hint">اختر الهمزة للفراغ الذي اخترته</div>
        ${hintShown
          ? `<div class="tip">💡 ${HINT[blanks[i].a]}</div>`
          : `<div style="text-align:center"><button class="btn alt hintBtn" style="margin-top:0">💡 تلميح</button></div>`
        }
        <div class="chips">
          ${pa.opts[i].map(g => `<button class="chip" data-g="${g}">${g}</button>`).join("")}
        </div>
      </div>
    `;
  } else if (!done) {
    controls = `<div class="hint">اضغط على أي فراغ لتبدأ</div>`;
  }

  const msgClass = pa.msgType === "no" ? "no" : "ok";

  const nextBtn = done && PARAS[pa.level][pa.idx + 1]
    ? `<button class="btn" id="nextP">الفقرة التالية ←</button>`
    : "";

  box.innerHTML = `
    <div class="chips" style="margin:0 0 .6rem">${levelBtns}</div>
    <div class="chips" style="margin:0 0 1rem">${paraBtns}</div>

    <div class="score-line">
      <span>بقي ${n - found} فراغ</span>
      <span>النقاط: ${pa.score}</span>
    </div>

    <div class="progress">
      <div style="width:${n ? (found / n) * 100 : 100}%"></div>
    </div>

    <div class="para">${body}</div>
    ${controls}

    <div class="feedback ${msgClass}">
      ${done ? `أحسنت! أكملت الفقرة بنتيجة ${pa.score} من ${n}` : pa.msg}
    </div>

    ${nextBtn}
  `;

  if (done && !pa.celebrated) {
    pa.celebrated = true;
    confetti();
  }

  if (pa.active !== null && !done) {
    const ctl = document.getElementById("paraControls");
    if (ctl) {
      setTimeout(() =>
        ctl.scrollIntoView({ behavior: "smooth", block: "center" }), 60
      );
    }
  }

  box.querySelectorAll(".lvl").forEach(b => {
    b.onclick = () => {
      resetPara(b.dataset.level, 0);
      drawPara();
    };
  });

  box.querySelectorAll(".fp").forEach(b => {
    b.onclick = () => {
      resetPara(pa.level, +b.dataset.idx);
      drawPara();
    };
  });

  const nb = document.getElementById("nextP");

  if (nb) {
    nb.onclick = () => {
      resetPara(pa.level, pa.idx + 1);
      drawPara();
    };
  }

  box.querySelectorAll(".pblank").forEach(el => {
    el.onclick = () => {
      const i = +el.dataset.i;
      if (!pa.ok[i]) {
        pa.active = i;
        pa.msg = "";
        drawPara();
      }
    };
  });

  box.querySelectorAll(".hintBtn").forEach(b => {
    b.onclick = () => {
      pa.showHint[pa.active] = true;
      drawPara();
    };
  });

  box.querySelectorAll(".chip").forEach(el => {
    el.onclick = () => {
      const i = pa.active;
      if (i === null) return;

      const g = el.dataset.g;
      pa.vals[i] = g;

      if (g === blanks[i].a) {
        pa.ok[i] = true;
        pa.score++;
        pa.active = null;
        pa.msg = "أحسنت! ✨";
        pa.msgType = "ok";

        sfx(true);
        speakWord(blanks[i].v || blanks[i].w);
      } else {
        pa.attempts[i] = (pa.attempts[i] || 0) + 1;
        pa.msg = "ليست الهمزة الصحيحة، جرّب مرة أخرى";
        pa.msgType = "no";

        sfx(false);
      }

      drawPara();
    };
  });
}


let og = null;
function orderPage() {
  return `<section class="view"><div class="hero"><h2>رتّب الكلمة</h2><p>اضغط الحروف بالترتيب الصحيح لتكوين الكلمة. إذا أخطأت تبدأ الكلمة من جديد.</p></div><div class="panel" id="orderBox"></div></section>`;
}
function setupOrder() {
  const letters = [...og.words[og.i]];
  let order;
  do { order = shuffle(letters.map((_, k) => k)); } while (letters.length > 1 && order.every((v, k) => v === k));
  og.tiles = order; og.placed = []; og.wrongFlag = false;
}


function drawOrder() {
  const box = document.getElementById("orderBox");
  if (!box) return;

  if (!og) {
    const source = selectedRuleId === "all"
      ? ALL
      : ALL.filter(x => x.r.id === selectedRuleId);

    const words = shuffle(
      source.filter(x => /^[\u0621-\u064A]+$/.test(x.w))
    ).slice(0, 6).map(x => x.w);

    if (!words.length) {
      box.innerHTML = `
        <div class="final">
          <h2>لا توجد كلمات مناسبة لهذه القاعدة حاليًا</h2>
          <a class="btn" href="#choose-game-order">اختر قاعدة أخرى</a>
        </div>
      `;
      return;
    }

    og = {
      words,
      i: 0,
      score: 0,
      res: [],
      msg: "",
      type: ""
    };

    setupOrder();
  }

  const total = og.words.length;

  if (og.i >= total) {
    const max = total * 10;
    saveResult("رتّب الكلمة", og.score, max);

    const rows = og.res.map(r =>
      `<div class="ord-row ${r.ok ? "ok" : "no"}">
        <span>${r.ok ? "✔" : "✘"}</span>
        <span>${r.w}</span>
      </div>`
    ).join("");

    box.innerHTML = `
      <div class="final">
        <div class="trophy">${og.score >= max * .7 ? "🏆" : "⭐"}</div>
        <h2>النتيجة: ${og.score} من ${max}</h2>
        ${rows}
        <p>${og.score === max ? "ممتاز! ترتيب كل الكلمات صحيح." : og.score >= max * .5 ? "أحسنت، راجع الكلمات التي أخطأت فيها." : "حاول مرة أخرى، وستتحسن."}</p>
        <button class="btn" id="ordAgain">العب مرة أخرى</button>
      </div>
    `;

    document.getElementById("ordAgain").onclick = () => {
      og = null;
      drawOrder();
    };

    if (og.score >= max * .7) confetti();
    return;
  }

  const w = og.words[og.i], letters = [...w];

  const slots = letters.map((_, k) =>
    og.placed[k] !== undefined
      ? `<span class="oslot${og.placed[k] === k ? " ok" : ""}">${letters[og.placed[k]]}</span>`
      : `<span class="oslot"></span>`
  ).join("");

  const tiles = og.tiles.map(idx =>
    og.placed.includes(idx)
      ? `<span class="tile gone"></span>`
      : `<button class="tile" data-idx="${idx}">${letters[idx]}</button>`
  ).join("");

  box.innerHTML = `
    <div class="score-line">
      <span>الكلمة ${og.i + 1} من ${total}</span>
      <span>النقاط: ${og.score}</span>
    </div>
    <div class="progress">
      <div style="width:${(og.i / total) * 100}%"></div>
    </div>
    <div class="oslots">${slots}</div>
    <div class="tiles">${tiles}</div>
    <div style="text-align:center;margin-top:.8rem">
      <button class="btn alt" id="ordUndo" style="margin-top:0">تراجع</button>
    </div>
    <div class="feedback ${og.type}">${og.msg}</div>
  `;

  box.querySelectorAll(".tile").forEach(b => b.onclick = () => {
    og.placed.push(+b.dataset.idx);
    og.msg = "";

    if (og.placed.length === letters.length) {
      const correct = og.placed.every((v, k) => v === k);

      if (correct) {
        const pts = og.wrongFlag ? 5 : 10;
        og.score += pts;
        og.res.push({ w, ok: !og.wrongFlag });
        og.msg = `أحسنت! +${pts} نقاط`;
        og.type = "ok";
        sfx(true);
        speakWord(w);
        drawOrder();

        setTimeout(() => {
          og.i++;
          setupOrder();
          og.msg = "";
          drawOrder();
        }, 1100);
        return;
      }

      og.wrongFlag = true;
      og.msg = "الترتيب غير صحيح، حاول مرة أخرى";
      og.type = "no";
      sfx(false);
      drawOrder();

      setTimeout(() => {
        og.placed = [];
        og.msg = "";
        drawOrder();
      }, 900);
      return;
    }

    drawOrder();
  });

  const undo = document.getElementById("ordUndo");
  if (undo) undo.onclick = () => {
    og.placed.pop();
    og.msg = "";
    drawOrder();
  };
}

// ---------- saved results (on this device) ----------
const STORE_KEY = "dawha-results";
function getResults() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || "[]"); } catch (e) { return []; } }
function saveResult(game, score, total) {
  try {
    const r = getResults();
    r.unshift({ game, score, total, date: new Date().toLocaleDateString("ar") });
    localStorage.setItem(STORE_KEY, JSON.stringify(r.slice(0, 30)));
  } catch (e) {}
}
const pureWord = w => /^[\u0621-\u064A]+$/.test(w);

function isValidHamzaQuestion(x) {
  if (!x || !pureWord(x.w)) return false;

  const chars = [...x.w];

  return (
    Number.isInteger(x.p) &&
    x.p >= 0 &&
    x.p < chars.length &&
    x.a === chars[x.p] &&
    Object.hasOwn(CL_MAP, x.a) &&
    x.r?.id !== "tanween"
  );
}

const hlWord = (w, p) => [...w].map((c, k) => k === p ? `<mark>${c}</mark>` : c).join("");

// ---------- الصح أم الخطأ ----------
let tf = null;
function tfPage() { return `<section class="view"><div class="hero"><h2>الصح أم الخطأ</h2><p>اقرأ الكلمة واحكم: هل كتابتها صحيحة؟</p></div><div class="panel" id="tfBox"></div></section>`; }

function drawTF() {
  const box = document.getElementById("tfBox");
  if (!box) return;

  if (!tf) {
    const source = WRONG_SET.filter(([w, p]) =>
      ALL.some(x =>
        x.w === w &&
        x.p === p &&
        (selectedRuleId === "all" || x.r.id === selectedRuleId)
      )
    );

    if (!source.length) {
      box.innerHTML = `
        <div class="final">
          <h2>لا توجد أسئلة لهذه القاعدة حاليًا</h2>
          <a class="btn" href="#choose-game-truefalse">اختر قاعدة أخرى</a>
        </div>
      `;
      return;
    }

    const picks = shuffle(source).slice(0, 8).map(([w, p, bad], i) => {
      const isOk = i % 2 === 0;
      const wrong = [...w].map((c, k) => k === p ? bad : c).join("");

      return {
        shown: isOk ? w : wrong,
        ok: isOk,
        fix: w
      };
    });

    tf = {
      q: picks,
      i: 0,
      score: 0,
      msg: "",
      type: ""
    };
  }

  if (tf.i >= tf.q.length) {
    const max = tf.q.length * 10;

    saveResult("الصح أم الخطأ", tf.score * 10, max);

    box.innerHTML = `
      <div class="final">
        <div class="trophy">
          ${tf.score >= tf.q.length * .7 ? "🏆" : "⭐"}
        </div>
        <h2>النتيجة: ${tf.score * 10} من ${max}</h2>
        <button class="btn" id="tfAgain">العب مرة أخرى</button>
      </div>
    `;

    document.getElementById("tfAgain").onclick = () => {
      tf = null;
      drawTF();
    };

    if (tf.score >= tf.q.length * .7) confetti();
    return;
  }

  const q = tf.q[tf.i];

  box.innerHTML = `
    <div class="score-line">
      <span>كلمة ${tf.i + 1} من ${tf.q.length}</span>
      <span>النقاط: ${tf.score * 10}</span>
    </div>

    <div class="progress">
      <div style="width:${(tf.i / tf.q.length) * 100}%"></div>
    </div>

    <div class="word">${q.shown}</div>

    <div class="opts">
      <button class="opt" data-v="1">✔ صح</button>
      <button class="opt" data-v="0">✘ خطأ</button>
    </div>

    <div class="feedback ${tf.type}">${tf.msg}</div>
  `;

  box.querySelectorAll(".opt").forEach(b => {
    b.onclick = () => {
      box.querySelectorAll(".opt").forEach(x => x.disabled = true);

      const right = (b.dataset.v === "1") === q.ok;

      if (right) {
        tf.score++;
        tf.msg = "أحسنت! ✨";
        tf.type = "ok";
        sfx(true);
        speakWord(q.fix);
      } else {
        tf.msg = q.ok
          ? "الكلمة صحيحة"
          : `الكتابة الصحيحة: ${q.fix}`;

        tf.type = "no";
        sfx(false);
      }

      box.querySelector(`.opt[data-v="${b.dataset.v}"]`)
        .classList.add(right ? "right" : "wrong");

      box.querySelector(".feedback").textContent = tf.msg;

      setTimeout(() => {
        tf.i++;
        tf.msg = "";
        drawTF();
      }, 1500);
    };
  });
}

// ---------- صنّف الهمزة ----------
const CL_MAP = {
  "أ": "على ألف",
  "إ": "على ألف",
  "آ": "على ألف",
  "ؤ": "على واو",
  "ئ": "على نبرة",
  "ء": "على السطر"
};let cl = null;
function clPage() { return `<section class="view"><div class="hero"><h2>صنّف الهمزة</h2><p>انظر إلى الهمزة المظللة، واختر الحرف الذي تُكتب عليه.</p></div><div class="panel" id="clBox"></div></section>`; }

function drawCL() {
  const box = document.getElementById("clBox");
  if (!box) return;

  if (!cl) {
    const classifyRules = RULES.filter(r =>
      ["wasat", "wasat-special", "akhir"].includes(r.id)
    );

    const allQuestions = classifyRules.flatMap(r =>
      r.items.map(([w, p]) => ({
        r,
        w,
        p,
        a: [...w][p]
      }))
    ).filter(x => pureWord(x.w) && CL_MAP[x.a]);

    const pool = selectedRuleId === "all"
      ? allQuestions
      : allQuestions.filter(x => x.r.id === selectedRuleId);

    if (!pool.length) {
      box.innerHTML = `
        <div class="final">
          <h2>لا توجد أسئلة تصنيف لهذه القاعدة حاليًا</h2>
          <a class="btn" href="#choose-game-classify">اختر قاعدة أخرى</a>
        </div>
      `;
      return;
    }

    cl = {
      q: shuffle(pool).slice(0, 8),
      i: 0,
      score: 0,
      msg: "",
      type: ""
    };
  }

  if (cl.i >= cl.q.length) {
    const max = cl.q.length * 10;

    saveResult("صنّف الهمزة", cl.score * 10, max);

    box.innerHTML = `
      <div class="final">
        <div class="trophy">
          ${cl.score >= cl.q.length * .7 ? "🏆" : "⭐"}
        </div>
        <h2>النتيجة: ${cl.score * 10} من ${max}</h2>
        <button class="btn" id="clAgain">العب مرة أخرى</button>
      </div>
    `;

    document.getElementById("clAgain").onclick = () => {
      cl = null;
      drawCL();
    };

    if (cl.score >= cl.q.length * .7) confetti();
    return;
  }

  const q = cl.q[cl.i];

  box.innerHTML = `
    <div class="score-line">
      <span>كلمة ${cl.i + 1} من ${cl.q.length}</span>
      <span>النقاط: ${cl.score * 10}</span>
    </div>

    <div class="progress">
      <div style="width:${(cl.i / cl.q.length) * 100}%"></div>
    </div>

    <div class="word">${hlWord(q.w, q.p)}</div>

    <div class="opts">
      ${[...new Set(Object.values(CL_MAP))].map(l =>
        `<button class="opt" data-l="${l}">${l}</button>`
      ).join("")}
    </div>

    <div class="feedback ${cl.type}">${cl.msg}</div>
  `;

  box.querySelectorAll(".opt").forEach(b => {
    b.onclick = () => {
      box.querySelectorAll(".opt").forEach(x => x.disabled = true);

      const right = b.dataset.l === CL_MAP[q.a];

      if (right) {
        cl.score++;
        cl.msg = "أحسنت! ✨";
        cl.type = "ok";
        sfx(true);
        speakWord(q.w);
      } else {
        cl.msg = `الصحيح: ${CL_MAP[q.a]}`;
        cl.type = "no";
        sfx(false);
      }

      b.classList.add(right ? "right" : "wrong");
      box.querySelector(".feedback").textContent = cl.msg;

      setTimeout(() => {
        cl.i++;
        cl.msg = "";
        drawCL();
      }, 1500);
    };
  });
}


// ---------- السباق على الوقت ----------
let rc = null, rcTimer = null;
function rcPage() { return `<section class="view"><div class="hero"><h2>السباق على الوقت</h2><p>أكمل أكبر عدد ممكن من الهمزات خلال 60 ثانية.</p></div><div class="panel" id="rcBox"></div></section>`; }

function rcNext() {
  const allQuestions = ALL.filter(x =>
    pureWord(x.w) &&
    Number.isInteger(x.p) &&
    x.p >= 0 &&
    x.p < [...x.w].length &&
    x.a === [...x.w][x.p] &&
    ["أ", "إ", "آ", "ؤ", "ئ", "ء"].includes(x.a)
  );

  const pool = selectedRuleId === "all"
    ? allQuestions
    : allQuestions.filter(x => x.r.id === selectedRuleId);

  if (!pool.length) {
    rc.done = true;
    return;
  }

  rc.cur = pool[Math.floor(Math.random() * pool.length)];
  rc.opts = makeOpts(rc.cur.a, 3);
}

function startRC() {
  if (rcTimer) clearInterval(rcTimer);
  rc = { left: 60, score: 0, wrong: 0, done: false, msg: "", type: "" };
  rcNext();
  rcTimer = setInterval(() => {
    rc.left--;
    if (rc.left <= 0) { rc.left = 0; rc.done = true; clearInterval(rcTimer); saveResult("السباق على الوقت", rc.score, rc.score + rc.wrong); }
    drawRC();
  }, 1000);
  drawRC();
}
function drawRC() {
  const box = document.getElementById("rcBox");
  if (!box || !rc) return;
  if (rc.done) {
    box.innerHTML = `<div class="final"><div class="trophy">⏱️</div><h2>انتهى الوقت</h2><p>إجابات صحيحة: ${rc.score} · إجابات خاطئة: ${rc.wrong}</p><button class="btn" id="rcAgain">العب مرة أخرى</button></div>`;
    document.getElementById("rcAgain").onclick = startRC;
    if (rc.score >= 10) confetti();
    return;
  }
  box.innerHTML = `
    <div class="score-line"><span>الوقت: ${rc.left} ث</span><span>صحيح: ${rc.score} · خطأ: ${rc.wrong}</span></div>
    <div class="progress"><div style="width:${(rc.left / 60) * 100}%"></div></div>
    <div class="word fill">${[...rc.cur.w].map((c, k) => k === rc.cur.p ? `<span class="blank"></span>` : c).join("")}</div>
    <div class="opts">${rc.opts.map(g => `<button class="opt" data-g="${g}">${g}</button>`).join("")}</div>
    <div class="feedback ${rc.type}">${rc.msg}</div>`;
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (rc.done) return;
    const right = b.dataset.g === rc.cur.a;
    if (right) { rc.score++; rc.msg = "✔"; rc.type = "ok"; sfx(true); }
    else { rc.wrong++; rc.msg = `✘ الصحيح: ${rc.cur.a}`; rc.type = "no"; sfx(false); }
    rcNext();
    drawRC();
  });
}

// ---------- نتائجي ----------
function resultsPage() {
  const r = getResults();
  const rows = r.length
    ? r.map(x => `<div class="ord-row ok"><span>${x.game}</span><span>${x.score} من ${x.total}</span><span>${x.date}</span></div>`).join("")
    : `<p>لا توجد نتائج بعد. العب لتظهر نتائجك هنا.</p>`;
  return `<section class="view"><div class="hero"><h2>نتائجي</h2><p>آخر النتائج محفوظة على هذا الجهاز.</p></div><div class="panel">${rows}</div><div style="text-align:center"><button class="btn alt" id="clearRes">مسح النتائج</button></div></section>`;
}
function bindResults() {
  const b = document.getElementById("clearRes");
  if (!b) return;
  b.onclick = () => { try { localStorage.removeItem(STORE_KEY); } catch (e) {} document.getElementById("app").innerHTML = resultsPage(); bindResults(); };
}

function confetti() {
  const colors = ["#c9a24a", "#7a1f2b", "#8a9a3b", "#f1dfae"];
  for (let n = 0; n < 140; n++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[n % colors.length];
    c.style.animationDuration = (2 + Math.random() * 2) + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4200);
  }
}
function chooseRulePage(gameId) {
  const rules = [
    { id: "wasat", title: "الهمزة المتوسطة", glyph: "ئ ؤ أ" },
    { id: "wasat-special", title: "الحالات الخاصة", glyph: "ء ئ" },
    { id: "tanween", title: "تنوين النصب", glyph: "ئًا ءًا" },
    { id: "qat-wasl", title: "همزة القطع والوصل", glyph: "أ ا" },
    { id: "awwal", title: "الهمزة في أول الكلمة", glyph: "أ إ آ" },
    { id: "akhir", title: "الهمزة في آخر الكلمة", glyph: "ء ئ ؤ" }
  ];

  return `
    <section class="view">
      <div class="hero">
        <h2>اختر القاعدة</h2>
        <p>حدد موضوع الهمزة الذي تريد التدرب عليه</p>
      </div>

      <div class="panel">
        <div class="cards">
          <a class="rule-card" href="#${gameId}?rule=all">
            <div class="glyph">🎯</div>
            <h3>كل القواعد</h3>
            <p>تدرب على جميع موضوعات الهمزة</p>
          </a>

          ${rules.map(r => `
            <a class="rule-card" href="#${gameId}?rule=${r.id}">
              <div class="glyph">${r.glyph}</div>
              <h3>${r.title}</h3>
              <p>ابدأ التدريب على هذه القاعدة</p>
            </a>
          `).join("")}
        </div>
      </div>

      <div class="pager">
        <a class="btn alt" href="#games">العودة إلى الألعاب</a>
      </div>
    </section>
  `;
}

function route() {
  

  if (rcTimer) {
    clearInterval(rcTimer);
    rcTimer = null;
  }

  const hash = location.hash.slice(1) || "home";
  const [h, queryString = ""] = hash.split("?");
  const params = new URLSearchParams(queryString);

  selectedRuleId = h.startsWith("choose-game-")
  ? "all"
  : params.get("rule") || "all";
  const app = document.getElementById("app");
  const rule = RULES.find(r => r.id === h);

  let after = null;
  let html;

  if (h.startsWith("choose-game-")) {
    const gameId = h.replace("choose-game-", "");
    const validGames = [
      "game", "truefalse", "classify", "race",
      "order", "para", "fix", "drag"
    ];

    html = validGames.includes(gameId)
      ? chooseRulePage(gameId)
      : home();
  }

  else if (h === "rules") html = rulesIndex();

  else if (h === "game") {
    html = gamePage();
    after = () => {
      game = null;
      drawGame();
    };
  }

  else if (h === "games") html = gamesHub();

  else if (h === "para") {
    html = paraPage();
    after = () => {
      pa = null;
      drawPara();
    };
  }

  else if (h === "order") {
    html = orderPage();
    after = () => {
      og = null;
      drawOrder();
    };
  }

  else if (h === "truefalse") {
    html = tfPage();
    after = () => {
      tf = null;
      drawTF();
    };
  }

  else if (h === "classify") {
    html = clPage();
    after = () => {
      cl = null;
      drawCL();
    };
  }

  else if (h === "race") {
    html = rcPage();
    after = startRC;
  }

  else if (h === "results") {
    html = resultsPage();
    after = bindResults;
  }

  else if (h === "about") html = aboutPage();

  else if (h === "fix") {
    html = fixPage();
    after = () => {
      fx = null;
      drawFix();
    };
  }

  else if (h === "drag") {
    html = dragPage();
    after = () => {
      dg = null;
      drawDrag();
    };
  }

  else if (rule) {
    html = rulePage(rule);
    after = () => mountMini(rule);
  }

  else html = home();

  app.innerHTML = html;
  renderDev();
  if (after) after();

  const section =
    h === "about" ? "about" :
    h === "rules" || rule ? "rules" :
    [
      "game", "games", "fix", "drag", "para",
      "order", "truefalse", "classify", "race",
      "results"
    ].includes(h) || h.startsWith("choose-game-")
      ? "game"
      : "home";

  document.querySelectorAll("nav.top a").forEach(a =>
    a.classList.toggle("active", a.dataset.nav === section)
  );

  window.scrollTo({ top: 0, behavior: "instant" });
}


(function () {
  const box = document.getElementById("leaves");
  for (let n = 0; n < 14; n++) {
    const l = document.createElement("div");
    l.className = "leaf";
    l.style.left = Math.random() * 100 + "%";
    l.style.animationDuration = (14 + Math.random() * 14) + "s";
    l.style.animationDelay = (-Math.random() * 20) + "s";
    l.style.transform = `scale(${0.6 + Math.random() * 0.9})`;
    box.appendChild(l);
  }
})();


window.addEventListener("hashchange", route);
route();
// ---------- حفظ الأخطاء (على هذا الجهاز) ----------
const MISS_KEY = "dawha-mistakes";
function getMistakes() { try { return JSON.parse(localStorage.getItem(MISS_KEY) || "[]"); } catch (e) { return []; } }
function setMistakes(m) { try { localStorage.setItem(MISS_KEY, JSON.stringify(m.slice(0, 60))); } catch (e) {} }
function recordMistake(w, p) {
  if (!ALL.some(x => x.w === w && x.p === p)) return;
  const m = getMistakes();
  if (!m.some(x => x.w === w && x.p === p)) { m.unshift({ w, p }); setMistakes(m); }
}
function clearMistake(w, p) { setMistakes(getMistakes().filter(x => !(x.w === w && x.p === p))); }
renderDev();
